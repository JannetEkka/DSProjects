services:
  - type: web
    name: chithi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn chithi.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: META_HACK_API_KEY
        sync: false
      - key: META_HACK_BASETEN_API_KEY
        sync: false
